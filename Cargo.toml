[package]
name = "venix"
version = "1.0.0"
edition = "2024"

[dependencies]
rayon = "1.12.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
codegen-units = 1
strip = true
debug = false

[profile.release.package."*"]
opt-level = 3
codegen-units = 1
strip = true
debug = false

[profile.release]
#lto = "fat"
#codegen-units = 1
opt-level = 3
strip = true
debug = false
