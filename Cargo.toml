[package]
name = "venix"
version = "1.1.7"
edition = "2024"
description = "A high-performance, archetype-based ECS engine written in Rust."
readme = "README.md"
repository = "https://github.com/ArjitSinghLodhi/Venix"
license = "MIT OR Apache-2.0"
keywords = ["ecs", "archetype", "simulation", "parallel"]
categories = ["game-engines", "development-tools"]

[features]
default = []
derive = ["dep:venix_derive"]

[dependencies]
venix_derive = { git = "https://github.com/ArjitSinghLodhi/Venix_derive", version = "1.0.0", optional = true }
fxhash = "0.2.1"
indexmap = "2.14.0"
rayon = "1.12.0"
thread_local = "1.1.10"

[dev-dependencies]
rusty-fork = "0.3.1"

[lib]
name = "venix"
path = "src/lib.rs"

[[test]]
name = "ecs_tests"
path = "tests/ecs_tests.rs"
required-features = ["derive"]